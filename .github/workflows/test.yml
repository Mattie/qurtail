name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-command:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: qurtail --version
      - run: python tests/installed_smoke.py
      - run: python -m unittest discover -s tests -v

  reference-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install . -r benchmarks/requirements.txt
      - name: Held-out monitoring gates
        run: >-
          python benchmarks/run_benchmarks.py
          --output benchmark-results/held-out.json
      - name: Reference performance gates
        run: >-
          python benchmarks/run_performance.py
          --output benchmark-results/performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reference-benchmark-results
          path: benchmark-results/*.json
