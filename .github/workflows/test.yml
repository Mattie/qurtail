name: Test

on:
  push:
  pull_request:

jobs:
  installed-command:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: qurtail --version
      - run: python tests/installed_smoke.py
      - run: python -m unittest discover -s tests -v

  reference-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . -r benchmarks/requirements.txt
      - name: Held-out monitoring gates
        run: >-
          python benchmarks/run_benchmarks.py
          --output benchmark-results/held-out.json
      - name: Reference performance gates
        run: >-
          python benchmarks/run_performance.py
          --output benchmark-results/performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-benchmark-results
          path: benchmark-results/*.json
