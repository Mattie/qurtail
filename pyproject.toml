[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qurtail"
version = "1.0.0"
description = "Follow logs while compacting conservative repeated patterns"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
qurtail = "qurtail:main"

[tool.setuptools]
py-modules = ["qurtail"]
